<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Metamorphosis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .access-full {
            text-align: center;
            padding: 40px 24px;
        }
        .access-full h1 {
            font-family: var(--font-display);
            font-size: clamp(1.6rem, 6vw, 2.2rem);
            font-weight: 700;
            margin-bottom: 16px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .access-full p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: var(--accent-gradient);
            color: white;
            text-decoration: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            transition: transform 0.2s var(--ease), box-shadow 0.2s;
            box-shadow: 0 8px 30px rgba(108, 92, 231, 0.35);
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(108, 92, 231, 0.45);
        }
    </style>
</head>
<body>
    <div class="access-full">
        <h1>🎉 ¡Guía desbloqueada!</h1>
        <p>Has completado el acceso. Aquí está tu guía de Lookmaxing.</p>
        <a href="index.html" class="btn-back">← Volver a la guía</a>
    </div>
</body>
</html>
